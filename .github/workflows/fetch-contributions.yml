name: Fetch GitHub Contributions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fetch-contributions.yml'
      - 'assets/data/contributions.json'
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab

jobs:
  fetch-contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution data from GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p assets/data

          # Build ISO date range (last 365 days) using Pacific Time to match GitHub's contribution graph
          FROM_DATE=$(TZ='America/Los_Angeles' date -d '1 year ago' '+%Y-%m-%d')
          TO_DATE=$(TZ='America/Los_Angeles' date '+%Y-%m-%d')
          FROM_OFFSET=$(TZ='America/Los_Angeles' date -d '1 year ago' '+%:z')
          TO_OFFSET=$(TZ='America/Los_Angeles' date '+%:z')

          # Fetch from GitHub GraphQL API (use Pacific Time offset so contributions match GitHub's profile)
          curl -s -X POST \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { user(login: \\\"DOCKPORT\\\") { contributionsCollection(from: \\\"${FROM_DATE}T00:00:00${FROM_OFFSET}\\\", to: \\\"${TO_DATE}T00:00:00${TO_OFFSET}\\\") { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date color } } } } } }\"}" \
            "https://api.github.com/graphql" \
            -o contributions_raw.json

          # Validate and extract the calendar object
          if ! jq -e '.data.user.contributionsCollection.contributionCalendar' contributions_raw.json > assets/data/contributions.json; then
            echo "ERROR: No calendar data found"
            cat contributions_raw.json
            exit 1
          fi

          echo "Saved contributions.json with $(jq '.totalContributions // 0' assets/data/contributions.json) total contributions"
          rm contributions_raw.json

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/data/contributions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution data [skip ci]"
            git push
          fi