name: Fetch GitHub Contributions

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    # Allow manual trigger from Actions tab

jobs:
  fetch-contributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution data from GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Build ISO date range (last 365 days)
          FROM_DATE=$(date -d '1 year ago' '+%Y-%m-%d')
          TO_DATE=$(date '+%Y-%m-%d')

          # GraphQL query
          QUERY="query { user(login: \"DOCKPORT\") { contributionsCollection(from: \"${FROM_DATE}T00:00:00Z\", to: \"${TO_DATE}T00:00:00Z\") { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date color } } } } } }"

          # Fetch and save
          curl -s -X POST \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"${QUERY}\"}" \
            "https://api.github.com/graphql" \
            -o contributions_raw.json

          # Extract just the calendar object for the frontend
          python3 -c "
import json

with open('contributions_raw.json') as f:
    data = json.load(f)

calendar = data.get('data', {}).get('user', {}).get('contributionsCollection', {}).get('contributionCalendar', {})
if not calendar:
    print('ERROR: No calendar data found')
    exit(1)

# Save as assets/data/contributions.json
import os
os.makedirs('assets/data', exist_ok=True)

with open('assets/data/contributions.json', 'w') as f:
    json.dump(calendar, f)

print(f'Saved contributions.json with {calendar.get(\"totalContributions\", 0)} total contributions')
" || exit 1

          rm contributions_raw.json

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/data/contributions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution data [skip ci]"
            git push
          fi